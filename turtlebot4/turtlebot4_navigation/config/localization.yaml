amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    # 2.0 (not 1.0): on the Pi, near-wall CPU spikes can stall AMCL for ~1s so it
    # stops publishing map->odom; a 2s forward-projection keeps the last map->odom
    # valid through the stall instead of the controller failing with
    # 'extrapolation into the future' (odom->map) and aborting the goal.
    transform_tolerance: 2.0
    # Auto-localize at the dock on startup so onboard bringup needs no manual
    # 2D Pose Estimate (publishes map->odom immediately). Pose captured via
    # `ros2 run tf2_ros tf2_echo map base_link` while docked + localized.
    # Assumes robot boots docked and the map's origin is the dock. If AMCL
    # starts mislocalized (e.g. dock moved or different map), set 2D Pose
    # Estimate once in RViz and recapture this pose.
    set_initial_pose: true
    initial_pose:
      x: -0.044
      y: -0.014
      z: 0.0
      yaw: -3.145
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
